[package]
name = "horton"
version = "0.16.0"
edition = "2024"
description = "Zero-dependency, zero-allocation LSM-tree KV store (no_std, no_alloc)"
license = "MIT OR Apache-2.0"

[dependencies]
# Intentionally minimal: the library may only use `core`, plus `loom` as an
# *optional* dependency enabled solely by the `loom` feature. (It cannot be a
# dev-dependency: cargo does not link dev-dependencies into the lib target
# itself, and the `multiwriter` ring shim compiles against Loom's modeled
# atomics when the feature is on. It is never linked in the default or
# `multiwriter`-only builds — zero production dependencies preserved.)
loom = { version = "=0.7.2", optional = true }

[features]
# Default build is hard no_alloc. `scratch-bump` is a default-off escape hatch
# (spec §1 refinement, 2026-09-12): a tiny dependency-free bump allocator over
# caller-provided memory, for internal scratch only. First real need is v0.4
# compaction; v0.2 does not implement it. It must never be required, never be
# global, and never pull in `alloc`.
scratch-bump = []
# `multiwriter`: default-off MPMC admission ring (docs/multiwriter-spec.md).
# The default build is byte-identical in behavior with or without the flag.
multiwriter = []
# `loom`: compile the `multiwriter` ring against Loom's modeled atomics so the
# tests/loom_ring.rs models exercise the real ring code. Test-only; implies
# `multiwriter`; never enabled in shipping builds.
loom = ["dep:loom", "multiwriter"]

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "write_only"
harness = false

[[bench]]
name = "wal_recovery"
harness = false

[[bench]]
name = "compaction"
harness = false

[[bench]]
name = "scan"
harness = false

# Keep debug symbols in release builds so instruction-count profiles
# (valgrind --tool=callgrind / cachegrind) can attribute cost to functions.
[profile.release]
debug = true
