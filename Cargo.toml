[package]
name = "horton"
version = "0.18.0"
edition = "2024"
rust-version = "1.88"
description = "Zero-dependency, zero-allocation LSM-tree KV store (no_std, no_alloc)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/horton"
readme = "README.md"
keywords = ["lsm", "key-value", "no-std", "embedded", "flash"]
categories = [
    "no-std::no-alloc",
    "embedded",
    "database-implementations",
    "data-structures",
]
# Ship the library, its docs and tests. Leave out scripts, CI and history.
exclude = [
    ".github/",
    "CLAUDE.md",
    "push_main.py",
    "xtensa-check.sh",
    "rust-toolchain.toml",
    "MUTATION_TRIAGE.md",
    "docs/history/",
    "docs/ARCHITECTURE_REVIEW.md",
]

[package.metadata.docs.rs]
features = ["multiwriter"]

[dependencies]
# None. The library uses only `core`.

# Test-only: `RUSTFLAGS="--cfg horton_loom"` compiles the `multiwriter` ring
# against Loom's modeled atomics so tests/loom_ring.rs checks the real ring
# code. A custom cfg (not a feature) keeps Loom out of every normal build
# and out of the public feature set.
[target.'cfg(horton_loom)'.dependencies]
loom = "=0.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(horton_loom)"] }

[features]
# `multiwriter`: default-off MPMC admission ring (docs/multiwriter-spec.md).
# The default build is byte-identical in behavior with or without the flag.
multiwriter = []

# The host key-value store example carries unit tests for its store
# layer; `cargo test` runs them.
[[example]]
name = "kvstore"
test = true

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "write_only"
harness = false

[[bench]]
name = "wal_recovery"
harness = false

[[bench]]
name = "compaction"
harness = false

[[bench]]
name = "scan"
harness = false

# Release builds: fat LTO and one codegen unit for the smallest, fastest
# code. Profiles do not reach dependents; they set their own.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Release code with debug symbols, so instruction-count profiles
# (valgrind --tool=callgrind / cachegrind) can attribute cost to
# functions: `cargo build --profile valgrind --benches`.
[profile.valgrind]
inherits = "release"
debug = true
