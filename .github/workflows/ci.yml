name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery
      - name: rustdoc (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flags: ""
          - profile: release
            flags: --release
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: cargo test ${{ matrix.flags }}
        run: cargo test ${{ matrix.flags }}
      - name: quickstart example
        if: matrix.profile == 'debug'
        run: cargo run --example quickstart
      - name: flight recorder power-cut test
        if: matrix.profile == 'release'
        run: cargo run --release --example flight_recorder -- torture 300
      - name: no ignored review-finding tests
        if: matrix.profile == 'debug'
        run: |
          if [ -f tests/review_findings.rs ]; then
            # Attribute lines only: the module docs mention the attribute.
            if grep -nE '^[[:space:]]*#\[ignore' tests/review_findings.rs; then
              echo "unfixed review findings remain"
              exit 1
            fi
          fi

  # The default-off `multiwriter` feature (and `loom`, which models its
  # ring) is compiled nowhere else, so API changes elsewhere in the crate
  # could break it unnoticed.
  features:
    name: features (multiwriter, loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: clippy (multiwriter)
        run: cargo clippy --all-targets --features multiwriter -- -D warnings -W clippy::pedantic -W clippy::nursery
      - name: clippy (loom)
        env:
          RUSTFLAGS: --cfg horton_loom
        run: cargo clippy --all-targets --features multiwriter -- -D warnings -W clippy::pedantic -W clippy::nursery
      - name: rustdoc (multiwriter, warnings are errors)
        run: cargo doc --no-deps --features multiwriter
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo test --features multiwriter
        run: cargo test --features multiwriter
      - name: loom models
        env:
          RUSTFLAGS: --cfg horton_loom
        run: cargo test --release --features multiwriter --test loom_ring

  # The flight recorder's horton, compiled to wasm: the dump viewer reading
  # real recordings, and the live logger surviving power cuts, a killed
  # Worker and a crashed tab. In Node, then in headless Chromium.
  ground-station:
    name: ground station (wasm)
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56.1 cannot
    # install Chromium ("Playwright does not support chromium on
    # ubuntu26.04-x64"). Unpin when the Playwright pin moves past that.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            examples/ground_station -> target
            examples/ground_station/live -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: fmt and clippy (wasm32)
        run: |
          for crate in examples/ground_station examples/ground_station/live; do
            (cd "$crate" && cargo fmt --check &&
              cargo clippy --release --target wasm32-unknown-unknown -- -D warnings -W clippy::pedantic -W clippy::nursery)
          done
      - name: record a flight
        run: cargo run --release --example flight_recorder -- --fresh --fast --ticks 12000
      - name: build the modules
        run: examples/ground_station/build.sh
      - name: read the recording
        run: node examples/ground_station/test.mjs target/flight_recorder/flash.img --newest 11999
      - name: read a recording killed mid-write
        run: |
          # Paced recording, SIGKILLed three times: each run resumes the
          # image the last one left.
          for i in 1 2 3; do
            timeout -s KILL 1.$i target/release/examples/flight_recorder --dir target/gs-cut || true
          done
          node examples/ground_station/test.mjs target/gs-cut/flash.img
      - name: live logger power-cut test
        run: node examples/ground_station/live-test.mjs 300 --export target/live-export
      - name: the native recorder restores the live logger's archive
        run: cargo run --release --example flight_recorder -- restore --dir target/live-export
      - name: browser tests
        working-directory: examples/ground_station
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node browser-test.mjs
          node live-browser-test.mjs

  # The host key-value store: horton the way LevelDB is used, on a real
  # file, from many threads, killed with SIGKILL (TerminateProcess on
  # Windows) mid-write. On each desktop OS, since the file device is
  # platform code.
  kvstore:
    name: kvstore (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: store unit tests
        run: cargo test --release --example kvstore
      - name: demo
        run: cargo run --release --example kvstore -- demo
      - name: command line
        run: |
          kv() { cargo run -q --release --example kvstore -- --db target/kvstore/cli.db "$@"; }
          kv put hello world
          test "$(kv get hello)" = world
          kv put a 1 && kv put b 2 && kv put c 3
          test "$(kv scan a c)" = "$(printf 'a = 1\nb = 2')"
          test "$(kv scan --reverse --limit 1)" = "hello = world"
          kv del hello
          if kv get hello; then exit 1; fi
          kv delrange a c
          test "$(kv scan)" = "c = 3"
          kv compact
          # Bad input fails before the store writes (issue 46).
          if kv put a 1 2; then exit 1; fi
          if kv delrange c a; then exit 1; fi
          if kv scan c a; then exit 1; fi
          test "$(kv scan)" = "c = 3"
          B=target/kvstore/bad.db; rm -f target/kvstore/bad.db*
          bad() { cargo run -q --release --example kvstore -- --db "$B" "$@"; }
          if bad get; then exit 1; fi
          test ! -e "$B"
          if bad --size-mb 8 put a 1 2> "$B.err"; then exit 1; fi
          grep -q -- "--size-mb" "$B.err"
          test "$(wc -c < "$B")" -eq 0
          bad put a 1
          test "$(bad get a)" = 1
      - name: two openers at once (issue 44)
        # Pairs of puts at the same time. A put that exits 0 is in the
        # store; a put that fails gives the lock error.
        run: |
          K=target/release/examples/kvstore; D=target/kvstore; DB=$D/race.db
          rm -f "$DB" "$DB.lock"; "$K" --db "$DB" --size-mb 128 stats > /dev/null
          refused=0
          check() { # key, exit status of its put
            if [ "$2" = 0 ]; then test "$("$K" --db "$DB" get "$1")" = 1
            else grep -q "open already" "$D/$1.err"; refused=$((refused + 1)); fi
          }
          for i in $(seq 1 20); do
            "$K" --db "$DB" put "a$i" 1 2> "$D/a$i.err" & a=$!
            "$K" --db "$DB" put "b$i" 1 2> "$D/b$i.err" & b=$!
            sa=0; wait "$a" || sa=$?; sb=0; wait "$b" || sb=$?
            check "a$i" "$sa"; check "b$i" "$sb"
          done
          # No pair at the same time is not a failure; the unit tests
          # check the lock without timing.
          echo "$refused of 40 puts refused by the lock"
      - name: crash test (fdatasync on)
        run: cargo run --release --example kvstore -- crash 25
      - name: crash test (no fdatasync, so more flushes and compactions per kill)
        run: cargo run --release --example kvstore -- --no-sync crash 25
      - name: benchmark
        # Unsynced, as a smoke test: runners' fsync (F_FULLFSYNC on macOS)
        # is too slow to time here.
        run: cargo run --release --example kvstore -- --no-sync bench --num 30000

  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      # Keep bare cargo/rustc (e.g. rust-cache's key probe) on nightly
      # instead of the 1.97.0 pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri setup
      # A fast subset (about 35 s of miri test time). The full suite under
      # miri takes too long for every push; tests/compress.rs alone takes
      # about 6 minutes because of its decoder fuzz, so it is left out.
      - run: >-
          cargo +nightly miri test
          --test crc
          --test wal
          --test memtable
          --test manifest
          --test write_batch
          --test slots

  bench-build:
    name: bench-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --benches

  # The library must build on its declared `rust-version`.
  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo +1.88 check --lib
      - run: cargo +1.88 check --lib --features multiwriter

  # What crates.io gets: the package builds from its own tarball.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - run: cargo publish --dry-run
