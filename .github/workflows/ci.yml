name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery
      - name: rustdoc (warnings are errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flags: ""
          - profile: release
            flags: --release
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
      - name: cargo test ${{ matrix.flags }}
        run: cargo test ${{ matrix.flags }}
      - name: quickstart example
        if: matrix.profile == 'debug'
        run: cargo run --example quickstart
      - name: flight recorder power-cut test
        if: matrix.profile == 'release'
        run: cargo run --release --example flight_recorder -- torture 300
      - name: no ignored review-finding tests
        if: matrix.profile == 'debug'
        run: |
          if [ -f tests/review_findings.rs ]; then
            # Attribute lines only: the module docs mention the attribute.
            if grep -nE '^[[:space:]]*#\[ignore' tests/review_findings.rs; then
              echo "unfixed review findings remain"
              exit 1
            fi
          fi

  # The default-off `multiwriter` feature (and `loom`, which models its
  # ring) is compiled nowhere else, so API changes elsewhere in the crate
  # could break it unnoticed.
  features:
    name: features (multiwriter, loom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - name: clippy (multiwriter)
        run: cargo clippy --all-targets --features multiwriter -- -D warnings -W clippy::pedantic -W clippy::nursery
      - name: clippy (loom)
        run: cargo clippy --all-targets --features loom -- -D warnings -W clippy::pedantic -W clippy::nursery
      - name: rustdoc (multiwriter, warnings are errors)
        run: cargo doc --no-deps --features multiwriter
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo test --features multiwriter
        run: cargo test --features multiwriter
      - name: loom models
        run: cargo test --release --features loom --test loom_ring

  miri:
    name: miri
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
      # Keep bare cargo/rustc (e.g. rust-cache's key probe) on nightly
      # instead of the 1.97.0 pin in rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri setup
      # A fast subset (about 35 s of miri test time). The full suite under
      # miri takes too long for every push; tests/compress.rs alone takes
      # about 6 minutes because of its decoder fuzz, so it is left out.
      - run: >-
          cargo +nightly miri test
          --test crc
          --test wal
          --test memtable
          --test manifest
          --test write_batch
          --test slots

  bench-build:
    name: bench-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --benches
